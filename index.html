<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polizia RP – Atlantis</title>
<style>
:root{color-scheme:dark;--bg:#06141b;--c:#0d2230;--t:#e8f1f5;--m:#8fa9b6;--p:#d4a73a;--pt:#06141b;--b:#1d3a4b;--r:#ff6b5e}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,"Segoe UI",sans-serif;color:var(--t);background:radial-gradient(1100px 520px at 50% -8%,#12425a 0,var(--bg) 62%) fixed;min-height:100vh}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 16px;background:rgba(6,20,27,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--b)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;font-weight:700;letter-spacing:.12em;font-size:13px}
.logo{width:34px;height:34px;object-fit:contain;font-size:26px;line-height:34px;text-align:center}
main{max-width:980px;margin:22px auto;padding:0 16px}
button{background:var(--p);color:var(--pt);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:600;transition:.15s}button:hover{filter:brightness(1.1);transform:translateY(-1px)}
button.g{background:transparent;color:var(--t);border:1px solid var(--b);font-weight:500}button.g.on{border-color:var(--p);color:var(--p)}button.d{background:var(--r);color:#fff}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--b);border-radius:8px;background:#08202c;color:var(--t);font:inherit}
input:focus,textarea:focus,select:focus{outline:2px solid var(--p);border-color:transparent}
textarea{min-height:130px;resize:vertical}label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin:10px 0 3px;color:var(--m)}
.card{background:linear-gradient(180deg,#0f2a3a,var(--c));border:1px solid var(--b);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
h2,h3{margin:.2em 0 .5em}.sub{color:var(--m)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.grid .card{margin:0}
.row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}.row input{flex:1;min-width:160px}
.hero{text-align:center;padding:8vh 16px 4vh}.hero .logo{width:96px;height:96px;font-size:72px;line-height:96px;margin:0 auto 10px;display:block}
.hero small{letter-spacing:.3em;color:var(--p);font-size:12px}.hero h1{font-size:clamp(34px,8vw,60px);margin:6px 0;letter-spacing:.06em}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 26px}.chips span{border:1px solid var(--b);border-radius:999px;padding:4px 14px;color:var(--m);font-size:13px}.chips b{color:var(--p)}
.login{max-width:360px;margin:0 auto;text-align:left}
.prof{display:flex;gap:22px;flex-wrap:wrap;align-items:center}.prof img,.mug{image-rendering:pixelated}.mug{float:right;margin-left:10px;border-radius:10px;border:2px solid var(--p)}
.hl{color:var(--r)}pre{white-space:pre-wrap;margin:0;font:inherit}
.dock{position:fixed;z-index:50;display:flex;align-items:center;gap:12px;padding:8px;border-radius:999px;background:rgba(0,0,0,.35);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);box-shadow:0 0 30px rgba(0,0,0,.3);left:50%;transform:translateX(-50%);bottom:18px}
.dk{position:relative;width:42px;height:42px;padding:0;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
.dk:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.3);transform:scale(1.1);filter:none}.dk.on{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.4)}
.dk i{display:none}main{padding-bottom:100px}
@media(min-width:768px){.dock{flex-direction:column;left:24px;top:50%;bottom:auto;transform:translateY(-50%)}main{padding-left:88px;padding-bottom:16px}
.dk i{display:block;position:absolute;left:100%;margin-left:14px;padding:5px 12px;border-radius:8px;background:rgba(0,0,0,.85);border:1px solid rgba(255,255,255,.1);font:700 11px system-ui;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;opacity:0;transform:translateX(-8px);transition:.2s;pointer-events:none;font-style:normal}.dk:hover i{opacity:1;transform:none}}
.bust{display:block;-webkit-user-select:none;user-select:none}
.ph{text-align:center;margin:8px 0 28px}.ptitle{font-size:clamp(28px,6vw,46px);font-weight:900;text-transform:uppercase;letter-spacing:-.02em;margin:0;background:linear-gradient(#fff,rgba(255,255,255,.6));-webkit-background-clip:text;background-clip:text;color:transparent}
.up{text-transform:uppercase;letter-spacing:.15em;font-size:13px}
.phero{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:34px;margin-bottom:34px}
.avw{position:relative}.glow{position:absolute;inset:0;border-radius:50%;background:linear-gradient(180deg,rgba(212,167,58,.3),rgba(59,130,246,.3));filter:blur(28px);opacity:.6}
.avb{position:relative;width:150px;height:150px;border-radius:2rem;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.4);backdrop-filter:blur(8px);overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 40px rgba(0,0,0,.4);transition:border-color .5s}
.avb:hover{border-color:rgba(212,167,58,.4)}.avb img{width:100%;height:100%;object-fit:contain;transform:translateY(8px);transition:transform .5s}.avb:hover img{transform:translateY(8px) scale(1.1)}
.greet{font-size:clamp(28px,5vw,46px);font-weight:900;margin:0;line-height:1.15;text-align:center}.gold{background:linear-gradient(90deg,var(--p),#fde68a,var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.tile{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:14px}.tile small{display:block;color:var(--m);margin-bottom:4px}.tile b{font-size:17px}
</style></head><body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="config.js"></script>
<script>
let sb,initErr="";
try{sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}})}catch(x){initErr=x.message}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const skin=(n,t="avatar",s=100)=>`https://mc-heads.net/${t}/${encodeURIComponent(n||"Steve")}/${s}`;
const fb=`onerror="this.onerror=null;this.src='https://mc-heads.net/avatar/Steve/100'"`;
const fmt=d=>new Date(d).toLocaleString("it-IT");
let me=null,cache={},main;

function logo(c){return LOGO_URL?`<img class="${c}" src="${esc(LOGO_URL)}" alt="">`:`<div class="${c}">🛡️</div>`}
function showLogin(msg=""){
 $("#app").innerHTML=`<div class="hero">${logo("logo")}<small>ATLANTIS RP</small><h1>POLIZIA</h1>
 <p class="sub">Portale interno per verbali, fedina penale e leggi.</p>
 <div class="chips"><span><b>H24</b> Operativa</span><span><b>Riservato</b> al personale</span></div>
 <div class="card login"><small class="sub">PORTALE INTERNO — ACCESSO RISERVATO</small><p class="hl">${esc(msg)}</p>
 <label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password">
 <p><button data-a="login" style="width:100%">Accedi al portale</button></p>
 <p class="sub" style="font-size:13px">Le utenze vengono create dall'amministrazione.</p></div></div>`;
 $("#app").onclick=e=>{if(e.target.dataset.a==="login")acts.login()};
 $("#pw").onkeydown=e=>{if(e.key==="Enter")acts.login()};
}
function showApp(){
 const adm=me.ruolo==="admin";
 const items=[["Profilo","👤","Profilo"],["Fedina","🗂️","Fedina penale"],["Verbali","📝","Verbali"],["Leggi","⚖️","Leggi"],["AI","🤖","Assistente AI"]];
 if(adm)items.push(["Utenti","👥","Utenti"]);
 const dock=items.map(([v,i,l])=>`<button class="dk" data-v="${v}" aria-label="${l}">${i}<i>${l}</i></button>`).join("");
 $("#app").innerHTML=`<header><div class="brand">${logo("logo")}POLIZIA · ATLANTIS RP</div><button data-a="logout">Esci</button></header>
 <nav class="dock">${dock}</nav><main></main>`;
 main=$("main");
 $("#app").onclick=async e=>{
  const v=e.target.closest("[data-v]");if(v)return go(v.dataset.v);
  const b=e.target.closest("[data-a]");if(!b)return;
  try{await acts[b.dataset.a](b.dataset.id,b)}catch(x){alert("Errore: "+x.message)}
 };
 let v="Profilo";try{v=localStorage.getItem("vista")||v}catch(e){}
 if(!views[v]||(v==="Utenti"&&!adm))v="Profilo";go(v);
}
const views={Profilo:vProfilo,Fedina:vFedina,Verbali:vVerbali,Leggi:vLeggi,AI:vAI,Utenti:vUtenti};
async function go(n){try{localStorage.setItem("vista",n)}catch(e){}
 document.querySelectorAll("[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===n));main.innerHTML="Caricamento…";try{await views[n]()}catch(x){main.innerHTML=`<p class="hl">Errore: ${esc(x.message)}</p>`}}
const ok=r=>{if(r.error)throw new Error(r.error.message);return r.data};
const field=(k,l,v="",ta=false,p="f")=>`<label>${l}</label>${ta?`<textarea data-${p}="${k}">${esc(v)}</textarea>`:`<input data-${p}="${k}" value="${esc(v)}">`}`;
const vals=(sel,p="f")=>{const o={};document.querySelectorAll(`${sel} [data-${p}]`).forEach(i=>o[i.dataset[p]]=i.type==="checkbox"?i.checked:i.value.trim());return o};

/* ---------- PROFILO ---------- */
function vProfilo(){
 const hr=new Date().getHours(),sal=hr<13?"Buongiorno":hr<18?"Buon pomeriggio":"Buonasera";
 const n=encodeURIComponent(me.nick||"Steve");
 const t=[["🆔","ID Utente#",me.num],["⛏️","Nick Minecraft",me.nick],["📛","Nome RP",me.nome_rp],["🎖️","Grado",me.grado],["📋","Qualifica",me.qualifica],["🔐","Ruolo Sistema",me.ruolo==="admin"?"Amministratore":"Agente"]];
 main.innerHTML=`<div class="ph"><h1 class="ptitle">Il mio profilo</h1><p class="sub up">Dati personali e informazioni di servizio</p></div>
 <div class="phero"><div class="avw"><div class="glow"></div><div class="avb"><img class="bust" src="https://render.crafty.gg/3d/bust/${n}" onerror="this.onerror=null;this.src='https://mc-heads.net/body/${n}/160'" alt="skin"></div></div>
 <h2 class="greet">${sal},<br><span class="gold">${esc(me.nome_rp||me.nick||"agente")}</span></h2></div>
 <div class="card"><h3>Dati Personali</h3><div class="tiles">${t.map(([i,l,v])=>`<div class="tile"><small>${i} ${l}</small><b>${esc(v)||"—"}</b></div>`).join("")}</div></div>`;
}

/* ---------- FEDINA ---------- */
async function vFedina(){
 cache.schede=ok(await sb.from("schede").select("*").order("modificato_il",{ascending:false}));
 main.innerHTML=`<div class="row"><input id="q" placeholder="Cerca nickname o nome RP"><button data-a="nuovaScheda">+ Nuova scheda</button></div>
 <div id="form"></div><div id="lista" class="grid"></div>`;
 $("#q").oninput=drawSchede;drawSchede();
}
function drawSchede(){
 const q=$("#q").value.toLowerCase();
 const l=cache.schede.filter(s=>(s.nick+" "+(s.nome_rp||"")).toLowerCase().includes(q));
 $("#lista").innerHTML=l.map(s=>`<div class="card"><img class="mug" src="${skin(s.nick,"avatar",90)}" ${fb} alt="mugshot">
 <h3>${esc(s.nick)}</h3><p><b>Nome RP:</b> ${esc(s.nome_rp)||"—"}<br><b>Telefono:</b> ${esc(s.telefono)||"—"}<br>
 <b>Associazione:</b> ${esc(s.associazione)||"—"}</p><p><b>Arresti:</b><br><pre>${esc(s.arresti)||"—"}</pre></p>
 <p><b>Note:</b><br><pre>${esc(s.note)||"—"}</pre></p><small>Aggiornata: ${fmt(s.modificato_il)}</small>
 <p><button class="g" data-a="editScheda" data-id="${s.id}">Modifica</button> <button class="d" data-a="delScheda" data-id="${s.id}">Elimina</button></p></div>`).join("")||"<p>Nessuna scheda trovata.</p>";
}
function formScheda(s={}){
 $("#form").innerHTML=`<div class="card"><h3>${s.id?"Modifica":"Nuova"} scheda</h3>
 ${field("nick","Nickname Minecraft",s.nick)}${field("nome_rp","Nome RP",s.nome_rp)}${field("telefono","Numero di telefono",s.telefono)}
 ${field("associazione","Associazione",s.associazione)}${field("arresti","Arresti",s.arresti,true)}${field("note","Note",s.note,true)}
 <p><button data-a="salvaScheda" data-id="${s.id||""}">Salva</button> <button class="g" data-a="annulla">Annulla</button></p></div>`;
 $("#form").scrollIntoView();
}

/* ---------- VERBALI ---------- */
async function vVerbali(){
 cache.moduli=ok(await sb.from("moduli").select("*").order("nome"));
 const adm=me.ruolo==="admin";
 main.innerHTML=`${adm?'<div class="row"><button data-a="nuovoModulo">+ Nuovo modulo</button></div>':""}<div id="form"></div>`+
 cache.moduli.map(m=>`<div class="card"><h3>${esc(m.nome)}</h3><textarea id="t${m.id}">${esc(m.testo)}</textarea>
 <p><button data-a="copia" data-id="${m.id}">Copia testo</button>
 ${adm?`<button class="g" data-a="editModulo" data-id="${m.id}">Modifica modulo</button> <button class="d" data-a="delModulo" data-id="${m.id}">Elimina</button>`:""}</p></div>`).join("");
}
function formModulo(m={}){
 $("#form").innerHTML=`<div class="card"><h3>${m.id?"Modifica":"Nuovo"} modulo</h3>${field("nome","Nome del verbale",m.nome)}
 ${field("testo","Testo / modello",m.testo,true)}<p><button data-a="salvaModulo" data-id="${m.id||""}">Salva</button> <button class="g" data-a="annulla">Annulla</button></p></div>`;
 $("#form").scrollIntoView();
}

/* ---------- LEGGI ---------- */
async function vLeggi(){
 const h=ok(await sb.from("leggi").select("*").order("id",{ascending:false}).limit(20));
 cache.leggi=h;const adm=me.ruolo==="admin";
 main.innerHTML=`<div class="card"><h3>Leggi Fondamentali</h3>
 <small>${h[0]?"Ultimo aggiornamento: "+fmt(h[0].creato_il):"Nessun testo salvato"}</small>
 ${adm?`<textarea id="leggi" style="min-height:360px">${esc(h[0]?.testo)}</textarea>
 <p><button data-a="salvaLeggi">Salva nuova versione</button></p>
 <label>Versioni precedenti (si caricano nella casella, poi premi Salva per renderle attive)</label>
 <select id="vers">${h.map((x,i)=>`<option value="${i}">${fmt(x.creato_il)}</option>`).join("")}</select>
 <p><button class="g" data-a="caricaVers">Carica versione</button></p>`:`<p class="sub">Solo l'amministratore può modificare questo testo.</p><pre>${esc(h[0]?.testo)}</pre>`}</div>`;
}

/* ---------- AI ---------- */
async function vAI(){
 cache.moduli=ok(await sb.from("moduli").select("*").order("nome"));
 main.innerHTML=`<div class="card"><h3>Assistente AI per i verbali</h3>
 ${AI_URL?"":'<p class="hl">L\'assistente non è ancora collegato (manca AI_URL).</p>'}
 <label>Tipo di verbale</label><select id="aim">${cache.moduli.map(m=>`<option value="${m.id}">${esc(m.nome)}</option>`).join("")}</select>
 <label>Racconta cosa è successo (anche in modo disordinato)</label><textarea id="fatti"></textarea>
 <p><button data-a="genera">Genera verbale</button></p>
 <label>Risultato (controllalo sempre prima di usarlo)</label><textarea id="out" style="min-height:260px"></textarea>
 <p><button class="g" data-a="copiaOut">Copia</button></p></div>`;
}

/* ---------- UTENTI (admin) ---------- */
async function vUtenti(){
 if(me.ruolo!=="admin")return;
 const u=ok(await sb.from("profiles").select("*").order("num"));
 main.innerHTML=`<p>Per aggiungere un nuovo poliziotto crea prima il suo account in Supabase (Authentication → Users → Add user), poi compare qui.</p>`+
 u.map(p=>`<div class="card" id="u${p.id}"><div class="row"><img src="${skin(p.nick,"avatar",48)}" ${fb} alt=""><b>ID #${p.num}</b></div>
 ${field("nick","Nick Minecraft",p.nick,false,"u")}${field("nome_rp","Nome RP",p.nome_rp,false,"u")}
 ${field("grado","Grado",p.grado,false,"u")}${field("qualifica","Qualifica",p.qualifica,false,"u")}
 <label>Ruolo Sistema</label><select data-u="ruolo"><option value="agente" ${p.ruolo==="agente"?"selected":""}>Agente</option><option value="admin" ${p.ruolo==="admin"?"selected":""}>Amministratore</option></select>
 <label><input type="checkbox" data-u="attivo" style="width:auto" ${p.attivo?"checked":""}> Account attivo</label>
 <p><button data-a="salvaUtente" data-id="${p.id}">Salva</button></p></div>`).join("");
}

/* ---------- AZIONI ---------- */
const acts={
 async login(){const r=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
  if(r.error)return showLogin("Email o password non corrette");start()},
 async logout(){await sb.auth.signOut();showLogin()},
 annulla(){$("#form").innerHTML=""},
 nuovaScheda(){formScheda()},
 editScheda(id){formScheda(cache.schede.find(s=>s.id===id))},
 async salvaScheda(id){const v=vals("#form");if(!v.nick)return alert("Inserisci il nickname");
  v.modificato_il=new Date().toISOString();
  ok(id?await sb.from("schede").update(v).eq("id",id):await sb.from("schede").insert(v));vFedina()},
 async delScheda(id){if(!confirm("Eliminare definitivamente questa scheda?"))return;ok(await sb.from("schede").delete().eq("id",id));vFedina()},
 copia(id){navigator.clipboard.writeText($("#t"+id).value).then(()=>alert("Copiato"))},
 copiaOut(){navigator.clipboard.writeText($("#out").value).then(()=>alert("Copiato"))},
 nuovoModulo(){formModulo()},
 editModulo(id){formModulo(cache.moduli.find(m=>m.id===id))},
 async salvaModulo(id){const v=vals("#form");if(!v.nome)return alert("Inserisci il nome");
  ok(id?await sb.from("moduli").update(v).eq("id",id):await sb.from("moduli").insert(v));vVerbali()},
 async delModulo(id){if(!confirm("Eliminare questo modulo?"))return;ok(await sb.from("moduli").delete().eq("id",id));vVerbali()},
 async salvaLeggi(){const t=$("#leggi").value;if(!t.trim())return alert("Il testo è vuoto");
  if(!confirm("Salvare come nuova versione delle leggi?"))return;ok(await sb.from("leggi").insert({testo:t}));vLeggi()},
 caricaVers(){$("#leggi").value=cache.leggi[$("#vers").value].testo},
 async salvaUtente(id){const v=vals("#u"+id,"u");ok(await sb.from("profiles").update(v).eq("id",id));alert("Salvato");
  if(id===me.id)Object.assign(me,v)},
 async genera(){
  if(!AI_URL)return alert("L'assistente AI non è ancora collegato.");
  const fatti=$("#fatti").value.trim();if(!fatti)return alert("Scrivi cosa è successo");
  const l=ok(await sb.from("leggi").select("testo").order("id",{ascending:false}).limit(1))[0];
  const m=cache.moduli.find(x=>x.id===$("#aim").value);$("#out").value="Sto scrivendo…";
  const r=await fetch(AI_URL,{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({leggi:l?.testo||"",modulo:m.testo,nomeModulo:m.nome,fatti,agente:me.nome_rp+" ("+me.grado+")"})});
  const d=await r.json();$("#out").value=d.testo||d.errore||"Errore"}
};
async function start(){
 const {data:{session}}=await sb.auth.getSession();if(!session)return showLogin();
 const r=await sb.from("profiles").select("*").eq("id",session.user.id).single();
 if(r.error||!r.data)return showLogin("Profilo non trovato");
 if(!r.data.attivo){await sb.auth.signOut();return showLogin("Account disattivato")}
 me=r.data;showApp();
}
if(SB_URL.startsWith("INCOLLA")||SB_KEY.startsWith("INCOLLA"))$("#app").innerHTML='<div class="card login"><h3>Configurazione mancante</h3><p>Compila SB_URL e SB_KEY nel file config.js.</p></div>';
else if(initErr)$("#app").innerHTML='<div class="card login"><h3>Errore di avvio</h3><p class="hl">'+esc(initErr)+'</p><p>Controlla SB_URL e SB_KEY (con le virgolette) e che la pagina possa caricare la libreria Supabase.</p></div>';
else{start();sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT")showLogin()})}
</script></body></html>
